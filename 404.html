<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page introuvable — Eneko</title>
  <link rel="icon" type="image/png" href="/assets/favicon-eneko-ai.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FAFAF8; --ink: #1A1A1A; --ink-mid: #555; --ink-soft: #999;
      --line: #E8E6E1; --accent: #8037EE;
      --accent-bg: rgba(128,55,238,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .logo { margin-bottom: 48px; }
    .logo img { height: 32px; width: auto; display: block; }
    .code {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(72px, 20vw, 120px);
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: var(--ink-mid);
      margin-bottom: 40px;
      text-align: center;
      max-width: 340px;
      line-height: 1.6;
    }
    .btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: 1.5px solid var(--accent);
    }
    .btn-primary:hover { background: #6d28d9; border-color: #6d28d9; }
    .btn-ghost {
      background: #fff;
      color: var(--ink-mid);
      border: 1.5px solid var(--line);
    }
    .btn-ghost:hover { border-color: #bbb; background: var(--paper); }
  </style>
</head>
<body>
  <div class="logo"><img src="/assets/logo-eneko.svg" alt="Eneko"></div>
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée. Retournez aux outils ou au site principal.</p>
  <div class="btns">
    <a class="btn btn-primary" href="/">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
      Voir les outils
    </a>
    <a class="btn btn-ghost" href="https://eneko.ai">
      ← Site principal
    </a>
  </div>
</body>
</html>
