      $('#dlg-ok').addEventListener('click', () => { dlg.close(); onOk(); });
    }
    function selectTab(id, focus) {
      for (const t of $$('[role=tab]')) {
        const on = t.dataset.tab === id;
        t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
        if (on && focus) t.focus();
      }
      for (const p of $$('[role=tabpanel]')) p.hidden = p.id !== 'panel-' + id;
    }
    document.addEventListener('keydown', (e) => {
      const tab = e.target.closest?.('[role=tab]');
      if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
        const tabs = $$('[role=tab]'); const k = tabs.indexOf(tab);
        const n = tabs[(k + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
        selectTab(n.dataset.tab, true); e.preventDefault(); return;
      }
      if (e.key === 'Enter' && e.target.id === 'f-site' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); readSite(cur()); return; }
      if (e.key === 'Enter' && e.target.id === 'doc-new' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('[data-act=doc-add]')?.click(); return; }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && ['profil', 'step'].includes(store.ui.view) && !$('#dlg').open) {
        e.preventDefault(); next();
      }
    });

    function addSuggestion(el) {
      const a = cur(); const fid = el.dataset.target; const txt = el.dataset.suggAdd;
      const input = document.getElementById('f-' + fid); if (!input) return;
      let v = input.value;
      if (el.dataset.replace || !v.trim()) v = txt;
      else v = v.replace(/\s+$/, '') + (input.tagName === 'TEXTAREA' ? '\n' : ', ') + txt;
      input.value = v; a.answers[fid] = v; touch(a);
      if (a.prefill?.[fid] === true) { a.prefill[fid] = 'vu'; document.getElementById('prefill-' + fid)?.remove(); }
      afterFieldChange(a, fid);
      input.focus();
      // « Zone d'intervention : … » → on sélectionne les points de suspension à remplacer.
      const k = v.lastIndexOf('…');
      if (k >= 0 && v.length - k <= 2) input.setSelectionRange(k, k + 1);
      else input.setSelectionRange(v.length, v.length);
    }

    function afterFieldChange(a, fid) {
      const s = stepsFor(a)[a.pos];
      const f = s?.fields.find((x) => x.id === fid);
      if (f && (f.type === 'textarea' || f.type === 'text')) {
        const h = document.getElementById('hint-' + fid); if (h) h.textContent = qualityHint(f, a.answers[fid]);
        const box = $(`[data-sugg="${fid}"]`);
        if (box) {
          box.innerHTML = suggHtml(suggestionsFor(a, s, f), fid, siteSuggFor(a, s, f));
        }
      }
      const btn = $('#btn-next'); if (btn && s) btn.disabled = !stepOk(a, s);
      updatePreview(a);
    }

    document.addEventListener('input', (e) => {
      const el = e.target; const a = cur();
      if (el.dataset.act === 'import') return;
      if (el.dataset.actInput === 'nom' && a) { a.nom = el.value.trim().slice(0, 120); touch(a); return; }
      if (el.dataset.fact && a) { a.facts = a.facts || {}; a.facts[el.dataset.fact] = el.checked; touch(a); return; }
      if (el.dataset.docok != null && a) {
        const d = a.answers.documents?.[+el.dataset.docok]; if (!d) return;
        a.docsOk = a.docsOk || {}; a.docsOk[d.nom] = el.checked; touch(a); return;
      }
      if (el.dataset.kind === 'toggle' && a) { a.answers[el.dataset.field] = el.checked; touch(a); updatePreview(a); return; }
      if ((el.dataset.kind === 'doc-check' || el.dataset.kind === 'doc-quand') && a) {
        const s = stepsFor(a)[a.pos]; const f = s.fields.find((x) => x.id === el.dataset.field);
        const nom = docNoms(a, f)[+el.dataset.k];
        const val = Array.isArray(a.answers[f.id]) ? a.answers[f.id] : [];
        if (el.dataset.kind === 'doc-quand') {
          const d = val.find((x) => x.nom === nom); if (d) d.quand = el.value;
          a.answers[f.id] = val; touch(a); updatePreview(a); return;
        }
        if (el.checked) {
          const def = f.options.find((o) => o.nom === nom)?.quand || '';
          if (!val.some((x) => x.nom === nom)) val.push({ nom, quand: def });
          // Garder l'ordre de la liste affichée.
          const ordre = docNoms(a, f); val.sort((x, y) => ordre.indexOf(x.nom) - ordre.indexOf(y.nom));
          a.answers[f.id] = val;
        } else {
          a.answers[f.id] = val.filter((x) => x.nom !== nom); // un document ajouté à la main disparaît de la liste
        }
        touch(a); rerenderFields(a, `input[data-kind="doc-check"][data-k="${el.dataset.k}"]`); return;
      }
      if (el.dataset.profil && a) {
        a.profil[el.dataset.profil] = el.value; touch(a);
        if (el.dataset.profil === 'activite' && a.prefill?.activite === true) { a.prefill.activite = 'vu'; $('#prefill-slot-activite').innerHTML = ''; }
        if (el.dataset.profil === 'site') { const st = $('#site-status'); if (st) st.innerHTML = siteStatusHtml(a); }
        if (el.dataset.profil === 'activite' || el.dataset.profil === 'site') { const as = $('#activite-sugg'); if (as) as.innerHTML = activiteSuggHtml(a); }
        const ok = profilOk(a); $('#btn-next').disabled = !ok;
        $('#profil-hint').textContent = ok ? '' : 'Choisissez votre rôle et votre secteur, et décrivez votre activité pour continuer.';
        return;
      }
      const fid = el.dataset.field; if (!fid || !a) return;
      if (a.prefill?.[fid] === true) { a.prefill[fid] = 'vu'; document.getElementById('prefill-' + fid)?.remove(); }
      if (el.dataset.kind === 'chips') {
        a.answers[fid] = $$(`input[data-field="${fid}"]:checked`).map((x) => x.value);
      } else if (el.dataset.kind === 'choice') {
        a.answers[fid] = el.value; touch(a);
        // Un choix peut afficher un champ (« Autre tâche ») et change les suggestions des étapes suivantes.
        const s = stepsFor(a)[a.pos];
        $('#fields').innerHTML = visibleFields(a, s).map((f) => fieldHtml(a, s, f)).join('');
        const again = $(`input[data-field="${fid}"][value="${CSS.escape(el.value)}"]`); if (again) again.focus();
        const btn = $('#btn-next'); if (btn) btn.disabled = !stepOk(a, s);
        updatePreview(a); return;
      } else {
        a.answers[fid] = el.value;
      }
      touch(a); afterFieldChange(a, fid);
    });
    document.addEventListener('change', (e) => {
      if (e.target.dataset.act === 'import' && e.target.files?.[0]) { importJson(e.target.files[0]); e.target.value = ''; }
    });

    // ── Démarrage ─────────────────────────────────────────────────────────
    async function boot() {
      loadStore();
      $('#storage-banner').hidden = storageOk;
      if (store.ui.projection) { document.documentElement.classList.add('projection'); $('[data-act=projection]').setAttribute('aria-pressed', 'true'); }
      if (store.ui.theme) document.documentElement.dataset.theme = store.ui.theme;
      try {
        await loadContent();
        render(false);
      } catch (err) {
        console.error(err);
        $('#app').innerHTML = `<div class="card" style="max-width:560px;margin:60px auto;text-align:center">
          <h2 class="section">Le contenu n'a pas pu être chargé</h2>
          <p class="muted" style="margin-bottom:16px">Vérifiez votre connexion, puis réessayez. Vos assistants enregistrés ne sont pas perdus.</p>
          <button class="btn primary" type="button" id="retry">Réessayer</button></div>`;
        $('#retry').addEventListener('click', () => { $('#app').innerHTML = '<div class="loading">Chargement…</div>'; boot(); });
      }
    }
    boot();
  })();
  </script>
</body>
</html>
